<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CC Brand Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("bb-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Вход -->
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <div class="logo">BB</div>
    <h1>CC Brand Board</h1>
    <p class="sub">Цены и доли рынка SKU</p>
    <label>Логин<input id="lUser" autocomplete="username" required></label>
    <label>Пароль<input id="lPass" type="password" autocomplete="current-password" required></label>
    <div id="lErr" class="err"></div>
    <button class="primary big">Войти</button>
  </form>
</div>

<!-- Приложение -->
<div id="app" hidden>
  <header class="top">
    <div class="bar">
      <div class="brand"><div class="logo sm">BB</div><div>
        <h1 id="title">CC Brand Board</h1>
        <input id="period" class="period" title="Период — нажмите, чтобы изменить">
      </div></div>
      <div class="tools">
        <div class="search"><span>⌕</span><input id="search" placeholder="Поиск SKU"></div>
        <div id="segTabs" class="tabs"></div>
        <button id="bAdd" class="primary">＋ SKU</button>
        <button id="bPng" title="Скачать борд картинкой для мессенджера">🖼 PNG</button>
        <button id="bTheme" class="theme-btn" title="Светлая / тёмная тема">🌓</button>
        <button id="bSave" class="accent">⇪ Сохранить</button>
        <details class="menu">
          <summary class="btn">⋯</summary>
          <div class="menu-list">
            <button id="bImport">⤓ Импорт Excel</button>
            <button id="bExport">⤒ Экспорт Excel</button>
            <button id="bJson">{ } Скачать board.json</button>
            <button id="bPrint">⎙ Печать / PDF — A4</button>
            <button id="bPrintA3">⎙ Печать / PDF — A3</button>
            <button id="bShowInactive">◌ Показать неактивные</button>
            <hr>
            <button id="bLogout">⎋ Выход</button>
          </div>
        </details>
        <select id="fSeg" hidden><option value="">Все</option></select>
        <input id="fileXlsx" type="file" accept=".xlsx,.xls,.csv" hidden>
      </div>
    </div>
    <div id="kpi" class="kpi"></div>
  </header>
  <main id="board" class="board"></main>
  <div id="status" class="toast"></div>
</div>

<!-- Редактор SKU -->
<dialog id="dlg">
  <form id="skuForm" method="dialog" class="form">
    <h2 id="dlgTitle">SKU</h2>
    <label>Family / SKU<input name="name" required></label>
    <label>Бренд<input name="brand" placeholder="Parliament"></label>
    <label>Формат пачки<input name="format" placeholder="KS, SSL, Compact…"></label>
    <label>Компания
      <select name="company"><option>BAT</option><option>JTI</option><option>KT&amp;G</option><option>PMI</option><option>OTHERS</option></select>
    </label>
    <label>Сегмент
      <select name="segment"><option>PREMIUM</option><option>MEDIUM</option><option>LOW</option></select>
    </label>
    <label>Цена, KZT / пачка<input name="price" type="number" step="1" required></label>
    <label>SoM YTD, %<input name="som" type="number" step="0.0001"></label>
    <label>Изменение, п.п.<input name="change" type="number" step="0.0001"></label>
    <label>Порядок в ячейке<input name="order" type="number" step="1" placeholder="авто"></label>
    <label class="check"><input name="active" type="checkbox"> Активен (показывать на борде)</label>
    <label class="wide">Примечание<input name="notes"></label>
    <label>Фото пачки<input name="imageFile" type="file" accept="image/*"></label>
    <label>…или ссылка / путь (images/xxx.jpg)<input name="image"></label>
    <img id="preview" class="preview" alt="">
    <div class="row">
      <button type="button" id="bDel" class="danger">Удалить</button>
      <span class="grow"></span>
      <button type="button" id="bCancel">Отмена</button>
      <button class="primary" value="ok">Сохранить</button>
    </div>
  </form>
</dialog>

<!-- Настройки GitHub -->
<dialog id="ghDlg">
  <form id="ghForm" method="dialog" class="form">
    <h2>Сохранение в репозиторий</h2>
    <p class="hint">Данные записываются в <code>data/skus.json</code> (и фото в <code>images/</code>) через GitHub API.
      Нужен fine-grained токен с правом <b>Contents: Read and write</b> на этот репозиторий. Токен хранится только в этом браузере.</p>
    <label>Владелец/репозиторий<input name="repo" placeholder="ekzotik-inc/SKU_test" required></label>
    <label>Ветка<input name="branch" placeholder="main" required></label>
    <label>Токен<input name="token" type="password" required></label>
    <div class="row"><span class="grow"></span>
      <button type="button" id="ghCancel">Отмена</button>
      <button class="primary" value="ok">Сохранить</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
